name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'playground/**'
      - 'results/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer commit supersede an in-flight build, but never cancel a deploy
# that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # VitePress lastUpdated reads git history

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Sync experiment figures into the site
        run: npm run sync:assets

      # The playground page prints "N of M traces match Python". This replays the
      # exported traces through the engine that page actually ships and fails the
      # deploy on any divergence outside the documented novelty tie-break, so the
      # claim is checked against the artifact being published, not against a copy.
      - name: Check the playground against the Python traces
        run: npm run check:playground

      # config.mts derives the base path from GITHUB_REPOSITORY, which Actions
      # always sets, so project Pages (/<repo>/) and user or organisation Pages
      # (/) both build unedited. Set DOCS_BASE here only to override it.
      - name: Build
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
