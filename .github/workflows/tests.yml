name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'nano/**'
      - 'tests/**'
      - 'scripts/*.py'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'nano/**'
      - 'tests/**'
      - 'scripts/*.py'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      # The suite needs no dataset; this proves the documented entry points also
      # run end to end, on the labelled stand-in wafer source.
      - name: Smoke-run the benchmark
        run: |
          python -m nano.benchmark --synthetic --wafers 3 --seeds 0 1 \
            --initial 10 --budget 15 --out /tmp/benchmark_summary.json
          python -m nano.demo --synthetic --wafers 2 --wafer 0 --seed 0 \
            --initial 10 --budget 10 --out /tmp/demo --no-gif
