name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'nano/**'
      - 'tests/**'
      - 'scripts/*.py'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'nano/**'
      - 'tests/**'
      - 'scripts/*.py'
      - 'pyproject.toml'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q

      # The suite needs no dataset; this proves the documented entry points also
      # run end to end, on the labelled stand-in wafer source.
      - name: Smoke-run the benchmark
        run: |
          python -m nano.benchmark --synthetic --wafers 3 --seeds 0 1 \
            --initial 10 --budget 15 --ablation --out /tmp/benchmark_summary.json
          python -m nano.benchmark --synthetic --target continuous --wafers 2 --seeds 0 \
            --initial 10 --budget 10 --no-figures --out /tmp/continuous_summary.json
          python -m nano.demo --synthetic --wafers 2 --wafer 0 --seed 0 \
            --initial 10 --budget 10 --out /tmp/demo --no-gif

      # The site refuses to build on a malformed results file, by design. This
      # catches that here rather than in the Pages deploy.
      - name: The results file must be strict JSON
        run: |
          python -c "
          import json, sys
          for path in ('/tmp/benchmark_summary.json', '/tmp/continuous_summary.json'):
              with open(path) as handle:
                  json.load(handle, parse_constant=lambda name: sys.exit(f'{path}: {name}'))
              print(f'{path}: ok')
          "
