<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>NANO social card source</title>
<!--
  Source for docs/public/social-card.png (1200x630).
  Regenerate by screenshotting this file at a 1200x630 viewport, e.g.

    npx playwright screenshot --viewport-size=1200,630 \
      scripts/social-card.html docs/public/social-card.png

  Self-contained: no external fonts, no external assets.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0b1017;
    color: #dce6f1;
    font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: grid;
    grid-template-columns: 1fr 400px;
    align-items: center;
    gap: 48px;
    padding: 64px 72px;
    position: relative;
  }
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(900px 480px at 92% 18%, rgba(46, 196, 214, 0.14), transparent 70%),
      radial-gradient(700px 400px at 4% 96%, rgba(139, 127, 212, 0.12), transparent 70%);
  }
  .content { position: relative; }
  .eyebrow {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 17px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #8fa3b8;
  }
  h1 {
    margin-top: 18px;
    font-size: 128px;
    line-height: 1;
    letter-spacing: -0.04em;
    background: linear-gradient(115deg, #45d2e3 25%, #a99bf0);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  h2 {
    margin-top: 14px;
    font-size: 30px;
    line-height: 1.28;
    font-weight: 600;
    letter-spacing: -0.01em;
    max-width: 15ch;
  }
  p.lead {
    margin-top: 20px;
    font-size: 21px;
    line-height: 1.45;
    color: #a9bdd1;
    max-width: 30ch;
  }
  .rule {
    margin-top: 26px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 16px;
    color: #45d2e3;
    letter-spacing: 0.04em;
  }
  .rule span.bar { width: 44px; height: 2px; background: #45d2e3; }
  .art { position: relative; }
  .art svg { display: block; width: 100%; height: auto; }
  .legend {
    margin-top: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 20px;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 14px;
    color: #8fa3b8;
  }
  .legend b { font-weight: 400; }
  .k-obs { color: #52d191; }
  .k-unc { color: #e7b155; }
  .k-next { color: #f0796c; }
</style>
</head>
<body>
  <div class="content">
    <p class="eyebrow">Team NANO · AI DLC Hackathon</p>
    <h1>NANO</h1>
    <h2>Reality-Aware AI Development Lifecycle</h2>
    <p class="lead">
      An autonomous metrology agent that knows what it does not know — and picks the next
      measurement worth taking.
    </p>
    <p class="rule"><span class="bar"></span> maximize knowledge of reality per measurement</p>
  </div>

  <div class="art">
    <svg viewBox="0 0 400 400" aria-hidden="true">
      <defs>
        <radialGradient id="unc" cx="38%" cy="34%" r="72%">
          <stop offset="0%" stop-color="#1d2a38" />
          <stop offset="55%" stop-color="#6b5a2a" />
          <stop offset="100%" stop-color="#e7b155" />
        </radialGradient>
        <clipPath id="wafer"><circle cx="200" cy="200" r="176" /></clipPath>
      </defs>

      <!-- uncertainty field, amber: known near the sampled centre, unknown at the edge -->
      <circle cx="200" cy="200" r="176" fill="url(#unc)" opacity="0.85" />

      <!-- die grid -->
      <g clip-path="url(#wafer)" stroke="#0b1017" stroke-width="1.4" opacity="0.55">
        <path d="M24 0V400M56 0V400M88 0V400M120 0V400M152 0V400M184 0V400M216 0V400M248 0V400M280 0V400M312 0V400M344 0V400M376 0V400" />
        <path d="M0 24H400M0 56H400M0 88H400M0 120H400M0 152H400M0 184H400M0 216H400M0 248H400M0 280H400M0 312H400M0 344H400M0 376H400" />
      </g>

      <circle cx="200" cy="200" r="176" fill="none" stroke="#45d2e3" stroke-width="3" />

      <!-- observed dies, green, centre-biased -->
      <g fill="#52d191">
        <rect x="152" y="152" width="32" height="32" />
        <rect x="216" y="184" width="32" height="32" />
        <rect x="184" y="248" width="32" height="32" />
        <rect x="120" y="216" width="32" height="32" />
        <rect x="248" y="120" width="32" height="32" />
        <rect x="152" y="88" width="32" height="32" />
        <rect x="88" y="152" width="32" height="32" />
        <rect x="216" y="280" width="32" height="32" />
      </g>

      <!-- recommended next die: unknown edge, coral crosshair -->
      <g stroke="#f0796c" stroke-width="4" fill="none">
        <rect x="312" y="280" width="32" height="32" />
        <circle cx="328" cy="296" r="34" />
        <path d="M328 240v20M328 332v20M272 296h20M364 296h20" />
      </g>
    </svg>

    <div class="legend">
      <span class="k-obs">■ <b>measured</b></span>
      <span class="k-unc">■ <b>unknown</b></span>
      <span class="k-next">✛ <b>measure next</b></span>
    </div>
  </div>
</body>
</html>
